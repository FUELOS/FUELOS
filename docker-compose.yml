services:
  db:
    image: postgres:16-alpine
    container_name: fuelos_postgres
    restart: always
    environment:
      POSTGRES_USER: fuelos_user
      POSTGRES_PASSWORD: fuelos_pass
      POSTGRES_DB: fuelos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
